<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f5f0" />
    <meta
      name="description"
      content="A simple, colorful Tic Tac Toe game for two players."
    />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Tic Tac Toe home">
          <span class="brand-mark" aria-hidden="true">✳</span>
          <span>little games</span>
        </a>
        <span class="game-label">THE CLASSIC</span>
      </header>

      <section class="game" aria-labelledby="game-title">
        <div class="intro">
          <p class="eyebrow">A FRIENDLY FACE-OFF</p>
          <h1 id="game-title">Tic <span> Tac </span> Toe</h1>
          <p class="subtitle">Three in a row. Bragging rights forever.</p>
        </div>

        <div class="scoreboard" aria-label="Score">
          <div class="player-score active" id="player-x">
            <span class="player-symbol x-symbol" aria-hidden="true">×</span>
            <span class="player-name">Player X</span>
            <span class="score" id="score-x">0</span>
          </div>
          <div class="score-divider" aria-hidden="true">—</div>
          <div class="player-score" id="player-o">
            <span class="player-symbol o-symbol" aria-hidden="true">○</span>
            <span class="player-name">Player O</span>
            <span class="score" id="score-o">0</span>
          </div>
        </div>

        <p class="status" id="status" aria-live="polite">Player X’s turn</p>

        <div class="board" role="group" aria-label="Tic Tac Toe board">
          <button class="cell" type="button" data-cell="0" aria-label="Row 1, column 1"></button>
          <button class="cell" type="button" data-cell="1" aria-label="Row 1, column 2"></button>
          <button class="cell" type="button" data-cell="2" aria-label="Row 1, column 3"></button>
          <button class="cell" type="button" data-cell="3" aria-label="Row 2, column 1"></button>
          <button class="cell" type="button" data-cell="4" aria-label="Row 2, column 2"></button>
          <button class="cell" type="button" data-cell="5" aria-label="Row 2, column 3"></button>
          <button class="cell" type="button" data-cell="6" aria-label="Row 3, column 1"></button>
          <button class="cell" type="button" data-cell="7" aria-label="Row 3, column 2"></button>
          <button class="cell" type="button" data-cell="8" aria-label="Row 3, column 3"></button>
        </div>

        <div class="actions">
          <button class="button button-primary" id="new-game" type="button">
            <span aria-hidden="true">↻</span> New round
          </button>
          <button class="button button-secondary" id="reset-score" type="button">
            Reset score
          </button>
        </div>
        <p class="hint">TAKE TURNS · HAVE FUN</p>
      </section>

      <footer class="footer">Made for one more round <span aria-hidden="true">♥</span></footer>
    </main>
  </body>
</html>
